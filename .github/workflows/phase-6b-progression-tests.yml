name: Phase 6B progression tests

on:
  push:
    branches: [phase-6b-trusted-progression]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt pytest pytest-asyncio httpx
      - name: Run Phase 6B tests (no production credentials)
        working-directory: backend
        run: python -m pytest -q tests/test_reducer_parity.py tests/test_progression_reservations.py tests/test_mongo_reservations.py tests/test_mongo_reservations_integration.py tests/test_recovery_sweep_integration.py
