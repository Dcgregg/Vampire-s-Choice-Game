name: Phase 6B story claim route tests

on:
  push:
    branches: [phase-6b-trusted-progression]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story-claim-route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install -r backend/requirements.txt pytest pytest-asyncio httpx
      - name: Run isolated claim, proof, issuance and credentialed read tests
        working-directory: backend
        run: python -m pytest -q tests/test_story_claim_routes.py tests/test_credentialed_story_claim_routes.py tests/test_anonymous_claim_proof.py tests/test_anonymous_credential_issuance.py tests/test_anonymous_credential_routes.py tests/test_credentialed_anonymous_read.py
