<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1224"/>
      <stop offset="70%" stop-color="#0e0813"/>
      <stop offset="100%" stop-color="#050307"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae092"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8b6826"/>
    </linearGradient>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2e56"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#5b070f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Ornate gothic arch border -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.4"/>

  <!-- Gothic Wings Silhouette -->
  <path d="M256 120 C 230 160 160 150 110 200 C 140 210 165 200 175 220 C 140 235 125 260 115 285 C 145 280 170 270 190 290 C 175 320 160 345 155 375 C 190 345 225 330 256 370 C 287 330 322 345 357 375 C 352 345 337 320 322 290 C 342 270 367 280 397 285 C 387 260 372 235 337 220 C 347 200 372 210 402 200 C 352 150 282 160 256 120 Z" 
        fill="#170d1e" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Gothic Dagger / Cross Centerpiece -->
  <path d="M256 95 L263 125 L285 130 L266 142 L272 170 L256 155 L240 170 L246 142 L227 130 L249 125 Z" fill="url(#goldGrad)"/>

  <!-- Central Crimson Blood Ruby Tear -->
  <path d="M256 185 C 230 240 210 290 210 325 C 210 355 230 375 256 375 C 282 375 302 355 302 325 C 302 290 282 240 256 185 Z" 
        fill="url(#bloodGrad)" filter="url(#glow)"/>

  <!-- Inner Highlight on Drop -->
  <ellipse cx="244" cy="305" rx="8" ry="18" fill="#ffffff" fill-opacity="0.4" transform="rotate(-20 244 305)"/>

  <!-- Lower Crescent & Roman Text Accent -->
  <path d="M220 415 Q 256 425 292 415" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="256" cy="428" r="3" fill="url(#goldGrad)"/>
</svg>
